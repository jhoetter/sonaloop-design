<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sonaloop-design · gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- The actual design system: tokens (incl. canonical --sl-*) + the shared component layer.
       Served from the repo root by scripts/serve.py, so absolute paths work at /. -->
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <style>
    /* Gallery chrome only — NOT part of the design system. */
    body { margin: 0; font-family: "Geist", system-ui, sans-serif; background: var(--sl-bg); color: var(--sl-ink);
      -webkit-font-smoothing: antialiased; letter-spacing: -.003em; }
    .gx-top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px;
      padding: 12px 24px; background: var(--sl-surface); border-bottom: 1px solid var(--sl-line); }
    .gx-top h1 { font-size: 15px; font-weight: 600; margin: 0; }
    .gx-top .gx-sub { font-family: var(--sl-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--sl-muted); }
    .gx-top nav { display: flex; gap: 14px; font-size: 13px; }
    .gx-top nav a { color: var(--sl-muted); text-decoration: none; }
    .gx-top nav a:hover { color: var(--sl-ink); }
    .gx-spacer { flex: 1; }
    .gx-toggle { font: inherit; font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 7px;
      border: 1px solid var(--sl-line); background: var(--sl-bg); color: var(--sl-ink); }
    .gx-sec { padding: 28px 24px; border-bottom: 1px solid var(--sl-line); }
    .gx-sec > h2 { margin: 0 0 18px; font-size: 14px; font-weight: 600; }
    .gx-sec > h2 small { font-family: var(--sl-mono); font-weight: 400; font-size: 11px; text-transform: uppercase;
      letter-spacing: .12em; color: var(--sl-faint); margin-left: 8px; }
    /* tokens */
    .gx-swatches { display: flex; flex-wrap: wrap; gap: 14px; }
    .gx-sw { width: 120px; }
    .gx-sw .chip { height: 46px; border-radius: 8px; border: 1px solid var(--sl-line); }
    .gx-sw .k { font-family: var(--sl-mono); font-size: 11px; color: var(--sl-muted); margin-top: 6px; display: block; }
    /* icons */
    .gx-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
    .gx-ico { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 14px 6px; border-radius: 8px;
      color: var(--sl-ink); text-align: center; }
    .gx-ico:hover { background: var(--sl-hover); }
    .gx-ico svg { width: 22px; height: 22px; }
    .gx-ico.gx-ico--hifi svg { width: 40px; height: 40px; }
    .gx-ico span { font-family: var(--sl-mono); font-size: 10px; color: var(--sl-faint); overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
    /* components, in two flavour columns */
    .gx-cols { display: grid; grid-template-columns: 1fr 1fr; }
    .gx-col { padding: 24px 26px; min-width: 0; }
    .gx-col + .gx-col { border-left: 1px solid var(--sl-line); }
    .gx-col h3 { margin: 0 0 2px; font-size: 1.05em; }
    .gx-col .gx-flavor { font-family: var(--sl-mono); font-size: .72em; text-transform: uppercase; letter-spacing: .14em; color: var(--sl-muted); margin-bottom: 20px; }
    .flavor-app { font-size: 13px; }   /* dense — the Python-SSR inspector */
    .flavor-web { font-size: 16px; }   /* airy  — the React/Tailwind website */
    .gx-group { margin: 0 0 24px; }
    .gx-group > .gx-label { display: block; font-family: var(--sl-mono); font-size: .68em; text-transform: uppercase; letter-spacing: .12em; color: var(--sl-faint); margin: 0 0 10px; }
    .gx-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    @media (max-width: 820px) { .gx-cols { grid-template-columns: 1fr; } .gx-col + .gx-col { border-left: 0; border-top: 1px solid var(--sl-line); } }
  </style>
</head>
<body>
  <header class="gx-top">
    <h1>sonaloop-design</h1>
    <span class="gx-sub">gallery</span>
    <nav><a href="#tokens">Tokens</a><a href="#icons">Icons</a><a href="#components">Components</a></nav>
    <span class="gx-spacer"></span>
    <button class="gx-toggle" id="theme">◐ Toggle theme</button>
  </header>

  <section class="gx-sec" id="tokens">
    <h2>Tokens <small>canonical --sl-* · theme-aware</small></h2>
    <div class="gx-swatches" id="swatches"></div>
  </section>

  <section class="gx-sec" id="icons">
    <h2>Icons <small>live from icons.data.mjs</small></h2>
    <div class="gx-group"><span class="gx-label">Regular · 24×24</span><div class="gx-icons" id="icons-reg"></div></div>
    <div class="gx-group"><span class="gx-label">Hi-fi · 48×48</span><div class="gx-icons" id="icons-hifi"></div></div>
  </section>

  <section class="gx-sec" id="components" style="padding:0">
    <div class="gx-cols">
      <div class="gx-col flavor-app" id="col-app"></div>
      <div class="gx-col flavor-web" id="col-web"></div>
    </div>
  </section>

  <script type="module">
    // ── Tokens (swatches) ──
    const swKeys = ['bg','surface','surface-2','ink','muted','faint','line','accent','accent-weak','green','amber','red'];
    document.getElementById('swatches').innerHTML = swKeys.map((k) =>
      `<div class="gx-sw"><div class="chip" style="background:var(--sl-${k})"></div><span class="k">--sl-${k}</span></div>`).join('');

    // ── Icons (live from the single source of truth) ──
    import('/icons.data.mjs').then(({ regular, hifi }) => {
      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      document.getElementById('icons-reg').innerHTML = Object.entries(regular).map(([name, spec]) =>
        `<div class="gx-ico" title="${esc(name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${spec.body}</svg><span>${esc(name)}</span></div>`).join('');
      document.getElementById('icons-hifi').innerHTML = Object.entries(hifi).map(([name, spec]) =>
        `<div class="gx-ico gx-ico--hifi" title="${esc(name)}"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${spec.body}</svg><span>${esc(name)}</span></div>`).join('');
    }).catch((e) => { document.getElementById('icons-reg').textContent = 'Could not load icons.data.mjs (' + e + ')'; });

    // ── Components (same markup, two density columns) ──
    const components = `
      <div class="gx-group"><span class="gx-label">Buttons</span>
        <div class="gx-row">
          <button class="sl-btn sl-btn--primary">Primary</button>
          <button class="sl-btn">Secondary</button>
          <button class="sl-btn sl-btn--accent">Accent</button>
          <button class="sl-btn sl-btn--ghost">Ghost</button>
          <button class="sl-btn sl-btn--sm">Small</button>
          <button class="sl-btn" disabled>Disabled</button>
        </div>
      </div>
      <div class="gx-group"><span class="gx-label">Badges</span>
        <div class="gx-row">
          <span class="sl-badge">Neutral</span>
          <span class="sl-badge sl-badge--accent">Accent</span>
          <span class="sl-badge sl-badge--positive">For</span>
          <span class="sl-badge sl-badge--warning">Conditional</span>
          <span class="sl-badge sl-badge--negative">Against</span>
        </div>
      </div>
      <div class="gx-group"><span class="gx-label">Tags (bordered)</span>
        <div class="gx-row">
          <span class="sl-tag">Conditional</span>
          <span class="sl-tag sl-tag--neutral">Misread</span>
          <span class="sl-tag sl-tag--warm">Objection</span>
        </div>
      </div>
      <div class="gx-group"><span class="gx-label">Pills &amp; chips</span>
        <div class="gx-row">
          <span class="sl-pill">Council</span><span class="sl-pill">4 personas</span>
          <span class="sl-chip">Theme: Planning</span><span class="sl-chip">Theme: Budget</span>
        </div>
      </div>
      <div class="gx-group"><span class="gx-label">Card</span>
        <div class="sl-card" style="max-width: 340px">
          <span class="sl-eyebrow">Synthesis</span>
          <h4 class="sl-card__title" style="margin-top:6px">Executive summary</h4>
          <p class="sl-card__body">A memory-grounded council reached a clear verdict — broadly supportive, no real opposition.</p>
          <hr class="sl-divider" />
          <div class="gx-row"><button class="sl-btn sl-btn--primary sl-btn--sm">Open</button><button class="sl-btn sl-btn--sm">Export</button></div>
        </div>
      </div>
      <div class="gx-group"><span class="gx-label">Input &amp; kbd</span>
        <div class="gx-row" style="max-width: 340px"><input class="sl-input" placeholder="Search everything…" /></div>
        <div class="gx-row" style="margin-top:10px"><span>Jump to anything <span class="sl-kbd">⌘</span> <span class="sl-kbd">K</span></span></div>
      </div>`;
    document.getElementById('col-app').innerHTML = '<h3>App components</h3><div class="gx-flavor">Python-SSR inspector · dense</div>' + components;
    document.getElementById('col-web').innerHTML = '<h3>Website components</h3><div class="gx-flavor">React / Tailwind · airy</div>' + components;

    const root = document.documentElement;
    document.getElementById('theme').addEventListener('click', () => {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    });
  </script>
</body>
</html>
