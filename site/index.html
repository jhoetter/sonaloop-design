<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sonaloop Design System</title>
  <meta name="description" content="Sonaloop design system for building consistent research, council and inspector experiences." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- The actual design system: tokens (incl. canonical --sl-*) + the shared component layer +
       the icon hover-animation layer. Served from the repo root by scripts/serve.py. -->
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/hifi-anim.css" />
  <!-- Docs-site chrome only (NOT part of the design system). -->
  <link rel="stylesheet" href="/site/app.css" />
</head>
<body>
  <a class="ds-skip" href="#main">Skip to content</a>

  <header class="ds-topbar">
    <a class="ds-brand" href="#/introduction" aria-label="Sonaloop Design home">
      <span class="ds-brand-mark" id="brand-mark"></span>
      <span class="ds-brand-name">Sonaloop <span>Design</span></span>
    </a>

    <button class="ds-search" id="search-open" aria-label="Search the design system">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="ds-search-ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search Sonaloop</span>
      <kbd class="sl-kbd">⌘K</kbd>
    </button>

    <span class="ds-top-spacer"></span>

    <div class="ds-seg" role="group" aria-label="Theme">
      <button class="ds-seg-btn" data-theme-set="light" title="Light" aria-label="Light theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
      </button>
      <button class="ds-seg-btn" data-theme-set="dark" title="Dark" aria-label="Dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </header>

  <div class="ds-shell">
    <aside class="ds-sidebar" id="sidebar"></aside>
    <main class="ds-main" id="main" tabindex="-1"></main>
  </div>

  <!-- Search palette -->
  <div class="ds-palette" id="palette" hidden>
    <div class="ds-palette-backdrop" data-palette-close></div>
    <div class="ds-palette-box" role="dialog" aria-modal="true" aria-label="Search">
      <div class="ds-palette-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="ds-search-ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="palette-input" type="text" placeholder="Search foundations, components, icons…" autocomplete="off" spellcheck="false" />
        <kbd class="sl-kbd">Esc</kbd>
      </div>
      <ul class="ds-palette-list" id="palette-list"></ul>
    </div>
  </div>

  <script type="module" src="/site/app.js"></script>
</body>
</html>
