<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design | sonaloop · design system</title>
  <meta name="description" content="Sonaloop design system for building consistent research, council and inspector experiences." />
  <!-- Sonaloop mark favicon (generated from the icon set by scripts/gen-favicon.mjs). -->
  <link rel="icon" type="image/svg+xml" href="/site/favicon.svg" />
  <!-- Sona — Sonaloop's own typeface, self-hosted from /fonts (no third-party dependency). -->
  <link rel="preload" href="/fonts/Sona-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/SonaMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/styles/fonts.css" />
  <!-- The actual design system: tokens (incl. canonical --sl-*) + the shared component layer +
       the icon hover-animation layer. Served from the repo root by scripts/serve.py. -->
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/hifi-anim.css" />
  <!-- Compiled Tailwind utilities for the "Website" section previews (generated, preflight-off,
       so it can't clobber the .ds-* chrome) + the shared marketing utilities (styles/website.css).
       Source: scripts/gen-website-css.mjs, scanning the real src/website.tsx components. -->
  <link rel="stylesheet" href="/site/website.css" />
  <!-- Docs-site chrome only (NOT part of the design system). -->
  <link rel="stylesheet" href="/site/app.css" />
</head>
<body>
  <a class="ds-skip" href="#main">Skip to content</a>

  <!-- The docs site dogfoods the shared .sl-app-shell layout (styles/components.css):
       a full-height sidebar (brand · search · collapsible nav · settings menu), a resize
       handle, and a topbar over the content. -->
  <div class="sl-app-shell" id="app">
    <aside class="sl-sidebar">
      <div class="sl-brand">
        <a class="sl-logo" href="#/introduction" aria-label="Sonaloop Design home">
          <span class="sl-logo__mark" id="brand-mark"></span>
          <span class="sl-logo__word">sona<span class="sl-logo__loop">loop</span> <span class="ds-brand-sub">Design</span></span>
        </a>
      </div>

      <div class="sl-sb-search">
        <button class="sl-cmdk-trigger" id="search-open" type="button" aria-label="Search the design system">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="sl-cmdk-trigger-ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search</span>
          <kbd class="sl-kbd">⌘K</kbd>
        </button>
      </div>

      <nav class="sl-sb-scroll" id="sidebar" aria-label="Sections"></nav>

      <!-- Bottom settings menu — the real .sl-segmented ThemeToggle (Light · System · Dark,
           canonical sun/monitor/moon glyphs injected in app.js), dogfooded. -->
      <div class="sl-usermenu" id="usermenu">
        <div class="sl-um-pop" id="umpop" hidden>
          <div class="sl-um-sec">
            <div class="sl-um-lbl">Theme</div>
            <div class="sl-segmented sl-segmented--fill" role="group" aria-label="Color scheme">
              <button type="button" class="sl-segmented__item" data-theme-set="light" data-theme-ico="sun" title="Light" aria-label="Light theme"></button>
              <button type="button" class="sl-segmented__item" data-theme-set="system" data-theme-ico="monitor" title="System" aria-label="System theme"></button>
              <button type="button" class="sl-segmented__item" data-theme-set="dark" data-theme-ico="moon" title="Dark" aria-label="Dark theme"></button>
            </div>
          </div>
          <div class="sl-um-sec">
            <div class="sl-um-lbl">Source</div>
            <a class="ds-um-link" href="https://github.com/jhoetter/sonaloop-design" target="_blank" rel="noreferrer">sonaloop-design ↗</a>
          </div>
        </div>
        <button class="sl-um-trigger" id="umbtn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="sl-um-ava" id="um-ico"></span>
          <span class="sl-um-name">Settings</span>
          <span class="sl-um-caret" id="um-caret"></span>
        </button>
      </div>
    </aside>

    <div class="sl-resize" id="rz" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>

    <div class="sl-main">
      <header class="sl-topbar">
        <button class="sl-iconbtn" id="sbt" type="button" data-sidebar-toggle aria-label="Toggle sidebar" title="Toggle sidebar ([)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <nav class="sl-breadcrumb" id="crumb" aria-label="Breadcrumb"></nav>
        <span class="sl-spacer"></span>
      </header>
      <main class="sl-shell-body" id="main" tabindex="-1"></main>
    </div>
  </div>

  <!-- Search palette — the shared .sl-cmdk command palette (sonaloop-design/components.css),
       the SAME component the marketing website mounts. Dogfooded here so it can't drift. -->
  <div class="sl-cmdk" id="palette" hidden>
    <div class="sl-cmdk-backdrop" data-palette-close></div>
    <div class="sl-cmdk-panel" role="dialog" aria-modal="true" aria-label="Search">
      <div class="sl-cmdk-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="sl-cmdk-head-ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="palette-input" class="sl-cmdk-input" type="text" placeholder="Search foundations, components, icons…" autocomplete="off" spellcheck="false" />
      </div>
      <div class="sl-cmdk-list" id="palette-list"></div>
      <div class="sl-cmdk-foot">
        <span><kbd class="sl-kbd">↑↓</kbd>Navigate</span>
        <span><kbd class="sl-kbd">↵</kbd>Open</span>
        <span><kbd class="sl-kbd">esc</kbd>Close</span>
      </div>
    </div>
  </div>

  <script type="module" src="/site/app.js"></script>
</body>
</html>
