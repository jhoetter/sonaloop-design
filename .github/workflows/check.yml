name: check
# Drift guard: fail a PR if any generated artifact (icons, tokens, tailwind preset,
# component css module) is stale vs its source. Run `npm run gen` locally and commit.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  generated-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generated design-system artifacts are up to date
        run: npm run check
